name: Verify model

# The environment this project is developed in cannot reach huggingface.co, so
# the weights-to-text step has never run there. GitHub's runners can reach it,
# which makes this workflow the only place that claim actually gets tested.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest gradio yt-dlp
      - name: Run tests
        run: pytest tests/ -q

  end-to-end:
    name: Full pipeline including weights
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ~1 GB of weights; caching keeps later runs to a couple of minutes.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/lipsync
          key: lipsync-weights-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Confirm the backend resolves to the vendored espnet
        run: |
          python - <<'PY'
          from lipsync.backend import _use_vendored_espnet
          _use_vendored_espnet()
          import espnet.nets.pytorch_backend.e2e_asr_transformer as m
          assert "lipsync/vendor" in m.__file__, m.__file__
          print("vendored espnet in use:", m.__file__)
          PY

      - name: Run the whole pipeline, weights included
        run: python scripts/verify_model.py
