[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipsync"
version = "0.1.0"
description = "Infer speech from silent video of a speaking face"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Preprocessing only. Deliberately light: this half runs anywhere, and is
# useful on its own for producing aligned mouth crops.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
# The recognition backend. Note there is deliberately no espnet requirement:
# stock espnet has no 3D-convolution visual front end and cannot load these
# checkpoints, so the modified subset that can is vendored in lipsync/vendor.
# See VENDOR.md. The checkpoints this downloads are non-commercial — see
# docs/RECOGNIZER.md.
recognize = [
    "torch>=2.0",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
lipsync = "lipsync.cli:main"

[tool.setuptools.packages.find]
include = ["lipsync*"]

[tool.setuptools.package-data]
lipsync = ["tokens/*.txt", "vendor/LICENSE.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
